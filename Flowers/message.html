<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Message ✨</title>
  <link rel="shortcut icon" href="gift_box.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling khusus untuk halaman ucapan */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #0d0826, #1a103c);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    .card-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 30px 40px;
      border-radius: 24px;
      text-align: center;
      max-width: 400px;
      margin: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: floatIn 1s ease-out;
      z-index: 10;
    }

    /* Animasi Karakter */
    .character-box {
      font-size: 80px;
      margin-bottom: 10px;
      animation: bounce 2s infinite ease-in-out;
      display: inline-block;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #ff8da1;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 25px;
    }

    .btn-back {
      display: inline-block;
      padding: 10px 24px;
      background: linear-gradient(135deg, #ff6b81, #ff8da1);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
    }

    .btn-back:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 107, 129, 0.6);
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(5deg);
      }
    }
  </style>
</head>

<body>

  <!-- Efek Kelopak Sakura Bertaburan -->
  <div class="sakura-container">
    <div class="petal" style="--left: 15%; --speed: 7s; --delay: 0s;"></div>
    <div class="petal" style="--left: 45%; --speed: 9s; --delay: 1s;"></div>
    <div class="petal" style="--left: 75%; --speed: 6s; --delay: 2s;"></div>
    <div class="petal" style="--left: 30%; --speed: 8s; --delay: 3s;"></div>
    <div class="petal" style="--left: 60%; --speed: 10s; --delay: 0.5s;"></div>
    <div class="petal" style="--left: 85%; --speed: 6.5s; --delay: 2.5s;"></div>
  </div>

  <!-- Kartu Pesan Spesial -->
  <div class="card-container">
    <!-- Karakter Animasi (Bisa berupa Maskot/GIF/SVG/Sticker) -->
    <div class="character-box">
      <img src="karakter_lucu.png" alt="" srcset="">
    </div>

    <h2>Semangat Ya! ✨</h2>

    <p>Ini untuk <b>just friend</b> aku yang lagi berjuang di semester ini... 🔥🔥</p>

    <a href="flowers.html" class="btn-back">🌸 Kembali ke Bunga</a>
  </div>

</body>

</html>
